[package]
name = "snapif"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Snapif"
repository = "https://github.com/snapif/snapif"
keywords = []
categories = []
publish = true

[features]
default = []
http = ["dep:reqwest", "dep:tokio", "dep:url"]
cli = ["http", "dep:clap"]

[[bin]]
name = "snapif"
path = "src/bin/snapif.rs"
required-features = ["cli"]

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = { version = "1.1", features = ["preserve_order"] }
reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", optional = true, features = ["rt", "macros", "time"] }
url = { version = "2", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }

[dev-dependencies]
pollster = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
trybuild = "1"
