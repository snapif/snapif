[package]
name = "snapif"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Snapif"
repository = "https://github.com/snapif/snapif"
keywords = []
categories = []

[features]
default = []

[dependencies]
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
toml = "0.8.23"

[dev-dependencies]
pollster = "0.4"
trybuild = "1"
