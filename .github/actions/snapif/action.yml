name: snapif
description: Run snapif gate or ask and fail the step when the verdict is not auto or a labeled ask misses.
inputs:
  mode:
    description: gate or ask
    required: true
    default: gate
  call:
    description: Path to a gate call JSON file
    required: false
    default: ""
  state:
    description: Path to an ask state JSON file
    required: false
    default: ""
  policy:
    description: Shipped policy id or toml path
    required: false
    default: ""
  question:
    description: Ask question id that must be a known false noul or a known choice label
    required: false
    default: ""
  deny_label:
    description: Choice label or the word true that fails the ask step
    required: false
    default: ""
  version:
    description: Crate version to cargo-install with --features cli before the step. Unset uses a snapif binary already on PATH. Setting it needs Rust on the runner.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: snapif
      shell: bash
      env:
        SNAPIF_BACKEND: ${{ env.SNAPIF_BACKEND }}
        SNAPIF_POLICY: ${{ inputs.policy }}
        SNAPIF_ACTION_PATH: ${{ github.action_path }}
        SNAPIF_MODE: ${{ inputs.mode }}
        SNAPIF_CALL: ${{ inputs.call }}
        SNAPIF_STATE: ${{ inputs.state }}
        SNAPIF_QUESTION: ${{ inputs.question }}
        SNAPIF_DENY_LABEL: ${{ inputs.deny_label }}
        SNAPIF_VERSION: ${{ inputs.version }}
      run: bash "$SNAPIF_ACTION_PATH/../../../scripts/snapif-action.sh" "$SNAPIF_MODE" "$SNAPIF_CALL" "$SNAPIF_STATE" "$SNAPIF_POLICY" "$SNAPIF_QUESTION" "$SNAPIF_DENY_LABEL" "$SNAPIF_VERSION"
