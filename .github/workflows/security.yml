name: Security

# Quiet-public. The jobs below stay commented until Snapif is meant to be found.
# Uncomment one job at a time. Do not add a badge, a README pitch, or a publish.

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  hold:
    name: Hold
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2
        with:
          egress-policy: audit
      - run: echo "CodeQL, Dependency Review, Scorecard, and FOSSA stay commented"

