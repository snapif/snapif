name: Release Please after merge

on: # zizmor: ignore[dangerous-triggers] reads the CI run id only; does not checkout the pull request
  workflow_dispatch:
  workflow_run:
    workflows: ["CI", "Auto-approve"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: release-please-after-merge-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    name: Dispatch Release Please
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start Release Please after an Actions merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TRIGGER: ${{ github.event.workflow_run.name }}
        run: python3 scripts/release_please_after_merge.py
