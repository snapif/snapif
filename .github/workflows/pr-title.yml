name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: false

jobs:
  title:
    name: Title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2
        with:
          egress-policy: audit
      - name: Conventional title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$TITLE" ]; then
            echo "no pull request title on this event"
            exit 0
          fi
          printf '%s\n' "$TITLE" | grep -Eq '^(feat|fix|perf|docs|chore|test|ci|refactor|style|build)(\([^)]+\))?!?: '
          echo "title ok"
